name: Unciv Agents 4.21.18 corrected final build

on:
  push:
    branches: [automation/unciv-agents-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout staged patches and final workflow
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Execute corrected complete compatibility workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          import yaml

          source = Path('.github/workflows/unciv-agents-final-v2.yml')
          document = yaml.safe_load(source.read_text(encoding='utf-8'))
          steps = document['jobs']['build-and-test']['steps']

          old_assertions = """              assert stats['civ_strength'] == 415, stats
              assert stats['population_strength'] == 30, stats
              assert stats['army_strength'] == 200, stats
          """
          corrected_assertions = """              assert stats == {
                  'culture_strength': 150,
                  'tech_strength': 1313,
                  'army_strength': 25,
                  'navy_strength': 25,
                  'civ_strength': 78,
                  'territory_strength': 30,
                  'population_strength': 52,
                  'production_strength': 8,
                  'commerce_strength': 4154,
                  'happiness': 42,
              }, stats
          """

          executed = 0
          for step in steps:
              script = step.get('run')
              if not script:
                  continue
              name = step.get('name', f'shell-step-{executed + 1}')
              if 'Smoke-test bridge, current metadata' in name:
                  if old_assertions not in script:
                      raise RuntimeError('Expected obsolete ranking assertions were not found')
                  script = script.replace(old_assertions, corrected_assertions)

              environment = os.environ.copy()
              for key, value in (step.get('env') or {}).items():
                  environment[str(key)] = str(value)
              working_directory = Path(step.get('working-directory', '.')).resolve()
              print(f'::group::{name}', flush=True)
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', script],
                  cwd=working_directory,
                  env=environment,
                  check=True,
              )
              print('::endgroup::', flush=True)
              executed += 1

          if executed < 8:
              raise RuntimeError(f'Only {executed} shell steps were executed')
          PY

      - name: Upload corrected final deliverables
        uses: actions/upload-artifact@v4
        with:
          name: unciv-agents-4.21.18-complete-v3
          path: |
            Unciv-Agents-4.21.18.zip
            Unciv-Agents-4.21.18-source.zip
            dist/BUILD-REPORT.txt
          compression-level: 0
          retention-days: 7
